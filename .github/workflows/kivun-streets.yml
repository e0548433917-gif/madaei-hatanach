# זמני: מיקודי חו"ל לפי אזור, עם שמות רחובות. רץ רק בענף kivun-postcodes-abroad2.
name: kivun-postcodes-abroad2
on:
  push:
    branches: [kivun-postcodes-abroad2]
    paths: [kivun/build_postcodes_abroad2.py, .github/workflows/kivun-streets.yml]
permissions:
  contents: write
concurrency:
  group: kivun-postcodes-abroad2
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: python3 kivun/build_postcodes_abroad2.py
        timeout-minutes: 280
        continue-on-error: true
