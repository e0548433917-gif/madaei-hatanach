# זמני: בניית רחובות מובנים לתוסף כיוון תפילה. רץ רק בענף kivun-streets-build, שיימחק אחרי השימוש.
name: kivun-abroad-wide
on:
  push:
    branches: [kivun-abroad-wide]
    paths: [kivun/build_streets.py, kivun/centers.json, .github/workflows/kivun-streets.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - run: python3 kivun/build_streets.py
      - run: |
          git config user.name Claude
          git config user.email noreply@anthropic.com
          git add kivun/streets-data.js kivun/build-log.txt
          git commit -m "kivun: streets-data.js (OSM, השלמה)"
          git push
