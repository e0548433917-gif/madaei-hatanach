# זמני: בניית רחובות מובנים לתוסף כיוון תפילה. רץ רק בענף kivun-streets-build, שיימחק אחרי השימוש.
name: kivun-postcodes-abroad
on:
  push:
    branches: [kivun-postcodes-abroad]
    paths: [kivun/build_streets.py, kivun/build_postcodes.py, kivun/centers.json, .github/workflows/kivun-streets.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 kivun/build_postcodes.py
        env:
          ABROAD_ONLY: "1"
      - run: |
          git config user.name Claude
          git config user.email noreply@anthropic.com
          git add kivun/postcodes-abroad.js kivun/build-log.txt
          git commit -m "kivun: postcodes.js (OSM)"
          git push
